<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard | THE DAILY BREW</title>
  <style>
    :root{--esp:#1B130E;--crm:#FAF6F0;--gold:#C69C53;--txt:#1F1814;--mut:#6E6259;--veg:#1E8E3E;--red:#C5221F}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--crm);color:var(--txt);padding-bottom:50px}
    .top{background:var(--esp);color:var(--crm);padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
    .top h1{font-size:1.15rem;color:var(--gold);letter-spacing:1px}
    .top a{color:var(--crm);font-size:.82rem;text-decoration:none;border:1px solid #665;padding:5px 12px;border-radius:99px}
    .wrap{max-width:680px;margin:0 auto;padding:16px}
    .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #E6DDD0}
    h2{font-size:1.25rem;color:var(--esp);margin-bottom:6px}
    .sub{font-size:.83rem;color:var(--mut);margin-bottom:14px;line-height:1.4}
    .fg{margin-bottom:12px}
    label{display:block;font-size:.78rem;font-weight:700;margin-bottom:5px}
    input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #D5CBBF;font-size:.95rem;background:#fff}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;padding:13px;border-radius:11px;border:none;font-size:.95rem;font-weight:700;cursor:pointer}
    .btn-dark{background:var(--esp);color:var(--gold)}
    .btn-gold{background:var(--gold);color:var(--esp)}
    .btn-out{background:#fff;border:1px solid #C8BEB0;color:var(--txt)}
    .btn-red{background:#FDECEA;color:var(--red)}
    .btn-sm{padding:6px 11px;font-size:.78rem;width:auto;border-radius:8px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .tab{padding:11px 6px;border-radius:10px;border:1px solid #DCD2C4;background:#fff;font-weight:700;font-size:.82rem;color:var(--mut)}
    .tab.active{background:var(--esp);color:var(--gold);border-color:var(--esp)}
    .hide{display:none!important}
    .msg{padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;margin-bottom:14px;display:none}
    .msg.ok{display:block;background:#E6F4EA;color:#137333}
    .msg.err{display:block;background:#FCE8E6;color:var(--red)}
    .msg.busy{display:block;background:#FEF7E0;color:#8D6E00}
    .dish{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #EFE7DC;align-items:center}
    .dish img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#eee}
    .dinfo{flex:1}
    .dacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .pill{font-size:.73rem;font-weight:700;padding:4px 9px;border-radius:6px;border:none}
    .in{background:#E6F4EA;color:var(--veg)}.out{background:#FCE8E6;color:var(--red)}
    .qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .qrcard{border:1.5px solid var(--esp);border-radius:12px;padding:12px;text-align:center}
    .qrcard img{width:140px;height:140px;margin:8px auto;display:block}
    @media print{.noprint{display:none!important}.qrgrid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <div class="top noprint">
    <h1>THE DAILY BREW &bull; Admin</h1>
    <a href="index.html">Live Menu &rarr;</a>
  </div>
  <div class="wrap">
    <div id="statusBox" class="msg noprint"></div>

    <div id="loginBox" class="card">
      <h2>Manager Sign-In</h2>
      <p class="sub">Paste your GitHub Fine-Grained Token (<code>github_pat_...</code>) to manage your live menu, photos, WhatsApp number, and table QR codes.</p>
      <div class="fg">
        <label>GitHub Personal Access Token</label>
        <input type="password" id="tok" placeholder="github_pat_..." />
      </div>
      <button type="button" class="btn btn-dark" id="unlockBtn">Unlock Manager Dashboard</button>
    </div>

    <div id="dashBox" class="hide">
      <div class="tabs noprint">
        <button type="button" class="tab active" data-t="menu">Menu Items</button>
        <button type="button" class="tab" data-t="set">Cafe &amp; GST</button>
        <button type="button" class="tab" data-t="qr">Table QRs</button>
      </div>

      <div id="pane-menu">
        <div class="card">
          <h2 id="fHead">Add New Dish / Drink</h2>
          <input type="hidden" id="editId" />
          <div class="fg"><label>Item Name *</label><input type="text" id="iName" placeholder="e.g., Iced Caramel Latte" /></div>
          <div class="row2">
            <div class="fg"><label>Category *</label><select id="iCat"></select></div>
            <div class="fg"><label>Price (₹) *</label><input type="number" id="iPrice" placeholder="220" /></div>
          </div>
          <div class="row2">
            <div class="fg"><label>Dietary</label><select id="iVeg"><option value="true">Veg</option><option value="false">Non-
